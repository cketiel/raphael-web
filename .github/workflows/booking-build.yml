# Builds the Booking Portal for Azure App Service (Linux) from a release tag.
#
# Why here and not on a workstation: the standalone server ships native binaries (sharp), and a
# Windows build carries the Windows ones. Why hoisted: pnpm's default layout is made of symlinks,
# which a zip deploy does not keep; a flat node_modules has none.
#
# It only builds. The artifact is attached to the tag's GitHub Release and deployed from there,
# so what runs in production is exactly what the Release holds. No secret is used or baked in:
# the server reads its configuration at start-up (apps/booking/.env.example).
name: Build Booking Portal (Linux)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag to build, e.g. v0.1.0"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # pnpm 10+ reads its settings from pnpm-workspace.yaml, not from --config flags: the flag was
      # silently ignored and the first artifact kept the symlinked layout. CI only, never committed.
      - name: Install (flat node_modules)
        run: |
          echo 'nodeLinker: hoisted' >> pnpm-workspace.yaml
          pnpm install --frozen-lockfile
          echo "node-linker: $(pnpm config get nodeLinker)"
          # Hoisted still links .bin and the workspace's own packages; what matters is the output.

      - name: Build
        run: pnpm --filter booking build

      - name: Assemble the standalone server
        run: |
          cd apps/booking
          cp -r .next/static .next/standalone/apps/booking/.next/static
          cp -r public .next/standalone/apps/booking/public
          test -z "$(find .next/standalone -name '.env*')" || { echo "::error::An .env file reached the artifact."; exit 1; }
          links=$(find .next/standalone -type l | wc -l)
          echo "symlinks in the standalone output: $links"
          test "$links" -eq 0 || { find .next/standalone -type l | head -20; echo "::error::The standalone output has symlinks, which a zip deploy does not keep."; exit 1; }
          version=$(node -p "require('./package.json').version")
          test "v$version" = "${{ inputs.ref }}" || { echo "::error::package.json says $version, the tag says ${{ inputs.ref }}."; exit 1; }
          cd .next/standalone && zip -qr "$GITHUB_WORKSPACE/booking-$version-linux-x64.zip" .

      # What ships is the zip, so the zip is what gets started: unpacked somewhere else, with no
      # access to the workspace, it must serve the login page.
      - name: Start the artifact
        run: |
          mkdir /tmp/smoke && cd /tmp/smoke && unzip -q "$GITHUB_WORKSPACE"/booking-*-linux-x64.zip
          RAPHAEL_API_ENV=prod SESSION_SECRET=$(openssl rand -hex 32) PORT=3000 HOSTNAME=127.0.0.1             node apps/booking/server.js > /tmp/smoke.log 2>&1 &
          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login || true)
            [ "$code" = 200 ] && break; sleep 1
          done
          cat /tmp/smoke.log
          test "$code" = 200 || { echo "::error::The artifact did not serve /login (last status $code)."; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: booking-linux-x64
          path: booking-*-linux-x64.zip
          if-no-files-found: error
